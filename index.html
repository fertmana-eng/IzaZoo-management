<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IzaZoo — מרכז ניהול</title>
<style>
:root{
  --bg:#f3f5f7;--panel:#ffffff;--line:#e6e9ee;--text:#111827;--muted:#7b8492;
  --nav:#0e1b2b;--nav2:#162a42;--gold:#e4bd72;--gold-soft:#f4ead4;
  --red:#e94b4b;--red-soft:#fde7e7;--blue:#3478db;--blue-soft:#e3edfb;
  --green:#25a95a;--green-soft:#e1f4e7;--purple:#7b45cc;--purple-soft:#eee6fb;
  --shadow:0 10px 30px rgba(15,23,42,.08);--radius:18px
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
body{min-height:100vh}
.app-shell{min-height:100vh}
.desktop-layout{display:grid;grid-template-columns:270px 320px minmax(0,1fr);min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;padding:28px 18px 18px;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column
}
.brand{padding:0 12px 28px}
.brand-name{font-family:Georgia,serif;font-size:38px;color:var(--gold);line-height:1}
.brand-sub{margin-top:9px;color:#e7ebf0;font-size:17px}
.section-label{font-size:11px;color:#8d9caf;margin:2px 12px 9px;letter-spacing:.08em}
.nav-list{display:flex;flex-direction:column;gap:9px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:13px;border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.035);color:#fff;border-radius:14px;padding:14px 13px;text-align:right
}
.nav-btn:hover,.nav-btn.active{background:rgba(228,189,114,.16);border-color:rgba(228,189,114,.2)}
.nav-btn .ico{width:26px;text-align:center;font-size:21px}.nav-btn .txt{display:flex;flex-direction:column;gap:2px}
.nav-btn .name{font-weight:800;font-size:15px}.nav-btn .sub{font-size:11px;color:#aab5c2}
.badge{margin-inline-start:auto;min-width:27px;height:27px;padding:0 7px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.red{background:var(--red)}.blue{background:var(--blue)}.green{background:var(--green)}.purple{background:var(--purple)}
.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:15px}
.profile{display:flex;align-items:center;gap:10px}.avatar{width:43px;height:43px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800}
.profile-role{font-size:11px;color:#b6c0cb}
.middle{
  padding:24px 16px;background:var(--bg);border-left:1px solid var(--line);overflow:auto
}
.middle h2{font-size:20px;margin:0 0 14px}
.section-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:15px;margin-bottom:14px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick{border:1px solid #e2e5ea;background:#fff;border-radius:11px;padding:10px;font-weight:800}
.open-item,.activity-item{border-top:1px solid #edf0f3;padding:11px 0}
.open-item:first-child,.activity-item:first-child{border-top:0}
.item-title{font-weight:800;font-size:14px}.item-meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.main{padding:24px 26px 28px;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.greeting{margin-inline-end:auto}.greeting h1{margin:0 0 4px;font-size:26px}.date{color:#4b5563;font-size:14px}
.search{width:280px;position:relative}.search input{width:100%;border:1px solid #dfe3e8;border-radius:12px;background:#fff;padding:10px 38px 10px 12px}.search span{position:absolute;right:13px;top:8px;color:#7d8794;font-size:20px}
.iconbtn{width:40px;height:40px;border:0;background:#fff;border-radius:11px;box-shadow:var(--shadow)}
.calendar-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-height:calc(100vh - 90px)}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.panel-head h2{margin:0;font-size:23px}.spacer{margin-inline-start:auto}.month-label{font-weight:800}
.controls{display:flex;gap:7px}.small-btn{border:1px solid #dfe3e9;background:#fff;border-radius:9px;padding:7px 10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:800;margin-bottom:5px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #e9ecf1;border-radius:12px;overflow:hidden}
.day{min-height:105px;padding:9px;border-left:1px solid #edf0f4;border-bottom:1px solid #edf0f4;background:#fff;cursor:pointer}
.day:nth-child(7n){border-left:0}.day.other{background:#fafbfc;color:#b3bac4}.day.today{outline:2px solid #1f2937;outline-offset:-2px;background:#fafafa}
.day-num{font-weight:800}.events{display:flex;flex-direction:column;gap:4px;margin-top:9px}.event-pill{font-size:10px;border-radius:7px;padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-problem{background:var(--red-soft);color:#991b1b}.event-update{background:var(--blue-soft);color:#1d4ed8}.event-task{background:var(--green-soft);color:#166534}
.legend{display:flex;gap:16px;justify-content:center;margin-top:13px;font-size:12px;color:#4b5563}.legend span{display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%}

/* portrait */
.mobile-layout{display:none;padding:14px 12px 22px}
body.is-portrait .module-problems .mobile-layout,body.is-portrait .module-tasks .mobile-layout,body.is-portrait .module-updates .mobile-layout,body.is-portrait .module-docs .mobile-layout{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.mobile-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.mobile-header .greeting{flex:1}
.mobile-brand{font-family:Georgia,serif;color:#b68b38;font-size:25px}
.category-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 5px 16px rgba(15,23,42,.05)}
.cat-card .ico{font-size:23px}.cat-card .name{font-size:11px;font-weight:800;margin-top:4px}.cat-card .count{font-size:10px;color:var(--muted);margin-top:2px}
.mobile-calendar{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.mobile-calendar .day{min-height:54px;padding:4px}.mobile-calendar .event-pill{display:none}.mobile-calendar .week{font-size:10px}.mobile-calendar .calendar{font-size:11px}
.mobile-section{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:13px;margin-bottom:12px}
.mobile-section h3{margin:0 0 10px;font-size:17px}
.mobile-list-item{padding:10px 0;border-top:1px solid #edf0f3}.mobile-list-item:first-child{border-top:0}
.mobile-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mobile-actions button{border:1px solid #e2e5ea;background:#fff;border-radius:11px;padding:10px;font-weight:800}

/* common pages/modals */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,textarea,select{width:100%;border:1px solid #dfe3e9;border-radius:10px;padding:11px;background:#fff}
textarea{min-height:110px}
.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}
.primary{border:0;background:#111827;color:#fff;border-radius:10px;padding:11px 14px;font-weight:800}
.secondary{border:0;background:#eef1f4;border-radius:10px;padding:11px 14px;font-weight:800}
.page-wrap{padding:20px}.page-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.list-card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:10px;background:#fff}
.fab{position:fixed;left:24px;bottom:24px;background:#111827;color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:800}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.login-brand{font-family:Georgia,serif;font-size:40px;color:#b68b38;text-align:center}.login-sub{text-align:center;color:#6b7280;margin-bottom:20px}

body.is-portrait .desktop-layout{display:none !important}
body.is-portrait .mobile-layout{display:block !important}
body.is-landscape .desktop-layout{display:grid !important}
body.is-landscape .mobile-layout{display:none !important}
@media(max-width:900px) and (orientation:landscape){
  .desktop-layout{grid-template-columns:180px 240px minmax(0,1fr)}
  .sidebar{padding:18px 10px}.brand-name{font-size:28px}.brand-sub{font-size:14px}.nav-btn{padding:10px 8px}.nav-btn .sub{display:none}
  .middle{padding:14px 10px}.main{padding:14px 12px}.calendar-card{padding:12px}.day{min-height:72px;padding:5px}.event-pill{display:none}
  .search{display:none}.greeting h1{font-size:20px}
}

.mobile-topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:12px}
.mobile-greeting h1{margin:0 0 3px;font-size:22px}
.mobile-search{grid-column:1/-1;position:relative}
.mobile-search input{width:100%;border:1px solid #dfe3e8;border-radius:12px;background:#fff;padding:10px 38px 10px 12px}
.mobile-search span{position:absolute;right:13px;top:8px;color:#7d8794;font-size:20px}
.portrait-main-grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:12px;align-items:start;margin-bottom:12px}
.portrait-main-grid .mobile-section,.portrait-main-grid .mobile-calendar{margin-bottom:0;height:100%}
.portrait-open{min-height:100%}
.portrait-calendar{min-width:0}
.middle{height:100vh;overflow-y:auto;scrollbar-gutter:stable}
.sidebar{overflow-y:auto}
.middle .section-card,.sidebar .nav-btn,.calendar-card,.mobile-section,.mobile-calendar,.cat-card{
  border-color:var(--line);
}
.middle .section-card{background:var(--panel)}
.quick,.mobile-actions button,.cat-card{transition:.15s ease}
.quick:hover,.mobile-actions button:hover,.cat-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,23,42,.06)}


/* Unified visual language: landscape matches portrait */
:root{
  --bg:#f4f5f7;
  --panel:#ffffff;
  --line:#e3e7ec;
  --text:#111827;
  --muted:#747f8f;
  --nav:#102033;
  --nav2:#162a42;
  --gold:#ddb96f;
  --shadow:0 6px 20px rgba(15,23,42,.065);
}
.sidebar{
  background:linear-gradient(180deg,var(--nav),var(--nav2));
}
.nav-btn{
  border:1px solid rgba(255,255,255,.055);
  background:rgba(255,255,255,.03);
  border-radius:14px;
}
.nav-btn:hover,.nav-btn.active{
  background:rgba(221,185,111,.15);
  border-color:rgba(221,185,111,.2);
}
.middle{
  background:var(--bg);
  border-left:1px solid var(--line);
  padding-top:24px;
}
.section-card,
.calendar-card,
.mobile-section,
.mobile-calendar,
.cat-card,
.page-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
}
.section-card h2,
.mobile-section h3{
  font-weight:800;
  letter-spacing:-.01em;
}
.open-item,.activity-item,.mobile-list-item{
  border-color:#edf0f3;
}
.item-title{
  color:var(--text);
}
.item-meta{
  color:var(--muted);
}
.calendar-card{
  border-radius:16px;
}
.day{
  border-color:#edf0f3;
}
.day.other{
  background:#fafbfc;
}
.event-problem{
  background:#fde8e8;
  color:#9f2525;
}
.event-update{
  background:#e7effb;
  color:#245da9;
}
.event-task{
  background:#e4f4e8;
  color:#216f3b;
}
.small-btn,.iconbtn{
  border:1px solid var(--line);
  background:#fff;
  box-shadow:none;
}
.middle .section-card{
  margin-bottom:14px;
}


/* Portrait dashboard — fixed right categories, full-width header over feed + calendar */
body.is-portrait .portrait-dashboard{
    display:grid !important;
    grid-template-columns:112px minmax(0,1fr);
    min-height:100vh;
    padding:0;
    background:var(--bg);
  }
  body.is-portrait .portrait-dashboard .portrait-sidebar{
    grid-column:1;
    grid-row:1;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    background:linear-gradient(180deg,#102033,#162a42);
    color:#fff;
    padding:18px 9px 14px;
    display:flex;
    flex-direction:column;
    border-left:1px solid rgba(255,255,255,.06);
  }
  body.is-portrait .portrait-brand{
    font-family:Georgia,serif;
    color:var(--gold);
    font-size:23px;
    text-align:center;
    margin:2px 0 20px;
  }
  body.is-portrait .portrait-nav{display:flex;flex-direction:column;gap:9px}
  body.is-portrait .portrait-cat{
    position:relative;
    min-height:76px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);
    color:#fff;
    border-radius:14px;
    padding:10px 5px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
  }
  body.is-portrait .portrait-cat-icon{font-size:22px;line-height:1}
  body.is-portrait .portrait-cat-name{font-size:11px;font-weight:800}
  body.is-portrait .portrait-cat-count{
    position:absolute;top:5px;left:6px;
    min-width:20px;height:20px;padding:0 5px;
    border-radius:999px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:900;
  }
  body.is-portrait .portrait-cat.problem{box-shadow:inset -3px 0 0 var(--red)}
  body.is-portrait .portrait-cat.update{box-shadow:inset -3px 0 0 var(--blue)}
  body.is-portrait .portrait-cat.task{box-shadow:inset -3px 0 0 var(--green)}
  body.is-portrait .portrait-cat.doc{box-shadow:inset -3px 0 0 var(--purple)}
  body.is-portrait .portrait-user{
    margin-top:auto;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,.09);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    font-size:11px;font-weight:800;
  }
  body.is-portrait .portrait-avatar{
    width:36px;height:36px;border-radius:50%;
    background:var(--gold);color:#182437;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;
  }

  body.is-portrait .portrait-workspace{
    grid-column:2;
    grid-row:1;
    min-width:0;
    padding:16px 14px 22px;
  }
  body.is-portrait .portrait-header{
    width:100%;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:12px;
  }
  body.is-portrait .portrait-header h1{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:-.02em;
  }
  body.is-portrait .portrait-date{
    color:var(--muted);
    font-size:12px;
    margin-bottom:11px;
  }
  body.is-portrait .portrait-search{position:relative}
  body.is-portrait .portrait-search input{
    width:100%;
    border:1px solid #dfe3e8;
    border-radius:11px;
    background:#f9fafb;
    padding:10px 38px 10px 11px;
  }
  body.is-portrait .portrait-search span{
    position:absolute;right:13px;top:7px;
    color:#7d8794;font-size:20px;
  }

  body.is-portrait .portrait-content{
    display:grid;
    grid-template-columns:minmax(165px,.78fr) minmax(0,1.45fr);
    gap:12px;
    align-items:start;
    direction:rtl;
  }
  body.is-portrait .portrait-feed{
    grid-column:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  body.is-portrait .portrait-calendar-card{
    grid-column:2;
    min-width:0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:12px;
  }
  body.is-portrait .portrait-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:13px;
  }
  body.is-portrait .portrait-card h3{margin:0 0 9px;font-size:15px}
  body.is-portrait .portrait-card .mobile-list-item{padding:9px 0}
  body.is-portrait .portrait-card .item-title{font-size:12px}
  body.is-portrait .portrait-card .item-meta{font-size:10px}
  body.is-portrait .portrait-calendar-card .panel-head{flex-wrap:wrap;margin-bottom:10px}
  body.is-portrait .portrait-calendar-card .panel-head h2{font-size:17px}
  body.is-portrait .portrait-calendar-card .month-label{font-size:11px}
  body.is-portrait .portrait-calendar-card .small-btn{font-size:10px;padding:5px 6px}
  body.is-portrait .portrait-calendar-card .week{font-size:9px}
  body.is-portrait .portrait-calendar-card .day{min-height:52px;padding:4px;font-size:10px}
  body.is-portrait .portrait-calendar-card .event-pill{display:none}
  body.is-portrait .portrait-calendar-card .legend{font-size:9px;gap:8px;flex-wrap:wrap}

@media (max-width:560px){
  body.is-portrait .portrait-dashboard{grid-template-columns:92px minmax(0,1fr)}
  .portrait-sidebar{padding-inline:6px !important}
  body.is-portrait .portrait-brand{font-size:19px}
  body.is-portrait .portrait-cat{min-height:66px}
  body.is-portrait .portrait-cat-icon{font-size:19px}
  body.is-portrait .portrait-cat-name{font-size:9px}
  body.is-portrait .portrait-workspace{padding:10px 8px 16px}
  body.is-portrait .portrait-header{padding:12px}
  body.is-portrait .portrait-header h1{font-size:19px}
  body.is-portrait .portrait-content{grid-template-columns:minmax(125px,.72fr) minmax(0,1.35fr);gap:8px}
  body.is-portrait .portrait-feed{gap:8px}
  .portrait-card,body.is-portrait .portrait-calendar-card{padding:9px;border-radius:13px}
  body.is-portrait .portrait-calendar-card .day{min-height:44px;padding:3px}
}


/* Landscape mirrors Portrait exactly: same hierarchy, same visual language */

  grid-template-columns:126px minmax(0,1fr);
  min-height:100vh;
  background:var(--bg);
}

body.is-landscape .landscape-nav{

body.is-landscape .landscape-cat-icon{font-size:22px;line-height:1}

body.is-landscape .landscape-cat.update{box-shadow:inset -3px 0 0 var(--blue)}
body.is-landscape .landscape-cat.task{box-shadow:inset -3px 0 0 var(--green)}

body.is-landscape .landscape-user{

:root{
  --bg:#f7f7f5;

  --sidebar:#171a1f;

  --accent:#6b5cff;

  --danger:#d94d55;

  --success:#2f8f5b;

  --radius-xs:8px;

  --shadow-2:0 6px 18px rgba(20,24,30,.045);

html,body{

/* ============================================================
   v15 — Matte, calm, professional
   Structure unchanged. No rounded corners.
   ============================================================ */

:root{
  --canvas:#f2f1ec;
  --paper:#fdfcf8;
  --paper-2:#f7f5ef;
  --paper-3:#efede6;

  --ink:#1f2a30;
  --ink-soft:#48545b;
  --muted:#7d8588;
  --muted-2:#a4aaa9;

  --brand:#233744;
  --brand-2:#2c4654;
  --brand-3:#385866;

  --accent:#a9855d;
  --accent-soft:#e9dfd2;

  --problem:#a86663;
  --problem-bg:#eee1df;
  --update:#687f8f;
  --update-bg:#e3e8ea;
  --task:#6d8172;
  --task-bg:#e5e9e4;
  --doc:#7d7384;
  --doc-bg:#e9e5eb;

  --line:#d8d5cd;
  --line-dark:#c7c2b8;

  --shadow-soft:0 6px 18px rgba(31,42,48,.035);
}

html,body{
  background:var(--canvas);
  color:var(--ink);
}

/* remove rounded corners globally on primary product surfaces */
.login-card,
.page-card,
.section-card,
.calendar-card,
.mobile-section,
.mobile-calendar,
.cat-card,
.portrait-single-header,
.portrait-single-calendar,
.portrait-single-card,
.landscape-header,
.landscape-card,
.landscape-calendar-card,
.modal-card,
.list-card,
.primary,
.secondary,
.small-btn,
.iconbtn,
input,
textarea,
select,
.calendar,
.day,
.week,
.fab{
  border-radius:0 !important;
}

/* calmer global surfaces */
.login-card,
.page-card,
.section-card,
.calendar-card,
.mobile-section,
.mobile-calendar,
.cat-card,
.portrait-single-header,
.portrait-single-calendar,
.portrait-single-card,
.landscape-header,
.landscape-card,

}

/* form language */
input,textarea,select{
  background:transparent;
  border:0;
  border-bottom:1px solid var(--line-dark);
  box-shadow:none;

}

input:focus,textarea:focus,select:focus{

body.is-landscape .landscape-cat.task .landscape-cat-count{background:#c1c9c1;color:#445b49}

   Layout and all other visual decisions unchanged. */

body,

/* =========================================================
   IzaZoo v35 — focused beta fixes
   ========================================================= */
:root{
  --keyboard-inset:0px;
  --app-vvh:100dvh;
  --app-vvtop:0px;
}
html,body,#root{overflow-x:hidden}
body{padding-bottom:env(safe-area-inset-bottom)}
.page{padding-bottom:calc(120px + var(--keyboard-inset))}
.admin-page,.feedback-page{padding-bottom:calc(140px + var(--keyboard-inset))}

/* Stronger, consistent module identity */
.module-problems .module-topbar,.module-problems .module-mobile-header{background:var(--module-problem-soft)}
.module-tasks .module-topbar,.module-tasks .module-mobile-header{background:var(--module-task-soft)}
.module-updates .module-topbar,.module-updates .module-mobile-header{background:var(--module-update-soft)}
.module-docs .module-topbar,.module-docs .module-mobile-header{background:var(--module-doc-soft)}
.module-problems .stable-search{border-inline-start:4px solid var(--module-problem)}
.module-tasks .stable-search{border-inline-start:4px solid var(--module-task)}
.module-updates .stable-search{border-inline-start:4px solid var(--module-update)}
.module-docs .stable-search{border-inline-start:4px solid var(--module-doc)}
.problem-card{border-inline-start:4px solid var(--module-problem)!important}
.task-card{border-inline-start:4px solid var(--module-task)!important}
.update-card{border-inline-start:4px solid var(--module-update)!important}
.knowledge-card{border-inline-start:4px solid var(--module-doc)!important}

/* Compact cards; full content belongs in the opened item */
.card-description-preview{
  display:-webkit-box!important;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden!important;
  white-space:normal!important;
  line-height:1.5;
}
.description-toggle{display:none!important}

/* Secondary system metadata */
.detail-business{
  margin-top:-7px;
  margin-bottom:14px;
  font-size:11px;
  color:var(--muted);
  font-weight:650;
}
.detail-system-meta{
  display:flex;
  flex-wrap:wrap;
  gap:4px 7px;
  margin-top:14px;
  padding-top:9px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

/* Chat-like updates */
.chat-message{
  display:block;
  width:100%;
  text-align:right;
  font:inherit;
  color:inherit;
  border-radius:14px!important;
  background:var(--paper)!important;
}
.chat-message-head,.chat-message-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:10px;
  color:var(--muted);
}
.chat-message-head{margin-bottom:7px}
.chat-message-head strong{font-size:11px;color:var(--ink)}
.chat-message-foot{margin-top:8px}
.update-body-preview{font-size:14px!important;line-height:1.6}

/* Search results */
.search-results-panel{
  margin-top:-1px;
  max-height:min(340px,45vh);
  overflow:auto;
  border:1px solid var(--line);
  background:var(--paper);
  box-shadow:0 12px 24px rgba(0,0,0,.08);
  z-index:80;
  position:relative;
}
.search-result-row{
  width:100%;
  border:0;
  border-top:1px solid var(--line);
  background:transparent;
  padding:10px 12px;
  display:flex;
  align-items:flex-start;
  gap:9px;
  text-align:right;
  color:var(--ink);
}
.search-result-row span{min-width:42px;font-size:9px;color:var(--muted);font-weight:800}
.search-result-row strong{font-size:12px;line-height:1.45}
.search-empty{padding:14px;color:var(--muted);font-size:12px;text-align:center}

/* Calendar markers use the exact module colors */
.calendar-markers{display:none;gap:3px;justify-content:center;align-items:center;margin-top:4px;min-height:6px}
.calendar-marker,.legend .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.calendar-marker.problem,.legend .dot.problem{background:var(--module-problem)}
.calendar-marker.task,.legend .dot.task{background:var(--module-task)}
.calendar-marker.update,.legend .dot.update{background:var(--module-update)}
.day.has-items:after{display:none!important}
.calendar-linked-item{border-inline-start:4px solid var(--line)!important}
.calendar-linked-item.calendar-problem{border-inline-start-color:var(--module-problem)!important}
.calendar-linked-item.calendar-task{border-inline-start-color:var(--module-task)!important}
.calendar-linked-item.calendar-update{border-inline-start-color:var(--module-update)!important}
.event-problem{background:var(--module-problem-soft)!important;color:var(--module-problem)!important}
.event-task{background:var(--module-task-soft)!important;color:var(--module-task)!important}
.event-update{background:var(--module-update-soft)!important;color:var(--module-update)!important}

/* Modal follows the visual viewport when the mobile keyboard opens */
.modal{
  inset:auto 0 auto 0!important;
  top:var(--app-vvtop)!important;
  height:var(--app-vvh)!important;
  padding:12px!important;
  align-items:center;
}
.modal-card{
  max-height:calc(var(--app-vvh) - 24px)!important;
  overflow-y:auto!important;
  overscroll-behavior:contain;
  scroll-padding-bottom:140px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))!important;
}
.modal-card input,.modal-card textarea,.modal-card select{scroll-margin-block:110px}
.danger-action{
  border:0;
  background:#8e4a45;
  color:#fff;
  border-radius:10px;
  padding:11px 14px;
  font-weight:800;
  flex:1;
}

/* Keep important controls away from Netlify's preview badge */
.fab{bottom:calc(78px + env(safe-area-inset-bottom))!important}
.app-toast{bottom:calc(86px + env(safe-area-inset-bottom))!important}

/* Feedback cards are actionable but visually neutral */
.feedback-card{width:100%;text-align:right;font:inherit;color:inherit;background:var(--paper)}
.user-actions{direction:rtl}
.user-actions button{background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--line)!important}

@media(max-width:700px){
  .calendar-markers{display:flex}
  .calendar .events{display:none!important}
  .modal{align-items:flex-start!important}
  .modal-card{margin:auto 0}
}

.feedback-preview{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.landscape-calendar-card{padding-top:4px!important}.portrait-single-calendar{padding-top:5px!important}

body.is-landscape .full-module-main{height:100dvh!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.install-offer{position:fixed;z-index:10000;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));direction:rtl;background:#fff;border:1px solid #d9e0e7;border-radius:16px;box-shadow:0 12px 34px rgba(15,23,42,.18);padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.install-offer-copy{display:flex;flex-direction:column;gap:3px;min-width:0}.install-offer-copy strong{font-size:16px}.install-offer-copy span{font-size:11px;color:var(--muted);line-height:1.4}

function visibleElementById(id){
  const nodes=[...document.querySelectorAll(`[id="${CSS.escape(id)}"]`)];
  return nodes.find(el=>{
    const r=el.getBoundingClientRect(),cs=getComputedStyle(el);

  const {data,error}=await supabaseClient.rpc("get_login_users");

async function login(message=""){
  selectedLoginUsername="";
  root().innerHTML=`<div class="login-wrap"><div class="login-card">
    <div class="login-brand">IzaZoo</div><div class="login-sub">מרכז ניהול</div>
    ${message?`<div style="margin:0 0 12px;padding:10px;border:1px solid #d8d5cd;background:#f7f5ef;font-size:13px">${esc(message)}</div>`:""}
    <label>שם משתמש</label><input id="lu" type="text" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')document.getElementById('lp')?.focus()">
    <label>סיסמה</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="primary" id="loginBtn" style="width:100%;margin-top:16px" onclick="doLogin()">כניסה</button>
  </div></div>`;
  setTimeout(()=>document.getElementById("lu")?.focus(),50);
}
function selectLoginUser(username,btn){
  selectedLoginUsername=username;
  document.querySelectorAll(".login-user-btn").forEach(x=>x.classList.remove("selected"));
  btn?.classList.add("selected");
  document.getElementById("lp")?.focus();
}

async function doLogin(){
  const btn=document.getElementById("loginBtn");
  const username=(document.getElementById("lu")?.value||"").trim().toLowerCase();
  const password=document.getElementById("lp")?.value||"";
  if(!username||!password)return alert("יש להזין שם משתמש וסיסמה");
  btn.disabled=true;btn.textContent="מתחבר...";
  const {data,error}=await supabaseClient.auth.signInWithPassword({email:`${username}@izazoo.local`,password});
  if(error){btn.disabled=false;btn.textContent="כניסה";return alert("ההתחברות נכשלה. בדוק משתמש וסיסמה.");}
  const ok=await loadCurrentUser(data.user);
  if(!ok)return;
  await loadAppData();
  initAppHistory();
  dashboard();
  if(currentUser.must_change_password) setTimeout(()=>changePasswordModal(true),80);
}

async function loadCurrentUser(authUser){
  if(!authUser){currentUser=null;return false;}
  const {data,error}=await supabaseClient
    .from("profiles")
    .select("username,first_name,last_name,display_name,role,is_active,must_change_password,all_businesses_access")
    .eq("id",authUser.id).single();
  if(error){console.error(error);await supabaseClient.auth.signOut();await login("לא ניתן לטעון את פרטי המשתמש.");return false;}
  if(!data.is_active){await supabaseClient.auth.signOut();await login("המשתמש אינו פעיל. פנה למנהל המערכת.");return false;}
  currentUser={
    id:authUser.id,
    name:data.display_name,
    firstName:data.first_name || String(data.display_name||"").split(/\s+/)[0] || data.username,
    lastName:data.last_name || "",
    username:data.username,
    role:data.role,
    is_active:data.is_active,
    must_change_password:data.must_change_password,
    all_businesses_access:!!data.all_businesses_access
  };
  return true;
}

function confirmLogout(){
  showModal(`<h2>להתנתק מהמערכת?</h2><div class="actions"><button class="secondary" onclick="hideModal()">ביטול</button><button class="primary" onclick="doLogout(this)">התנתקות</button></div>`);
}
async function doLogout(btn){
  setBusy(btn,true,"מתנתק...");
  await supabaseClient.auth.signOut();
  currentUser=null;problems=[];problemActivity=[];businesses=[];userBusinesses=[];
  hideModal();await login();
}
async function logout(){confirmLogout();}

function changePasswordModal(forced=false){
  showModal(`<h2>${forced?"נדרשת החלפת סיסמה":"שינוי סיסמה"}</h2>
    ${forced?`<p class="u-sub">הסיסמה הנוכחית היא זמנית. יש לבחור סיסמה חדשה כדי להמשיך.</p>`:""}
    <label>סיסמה חדשה</label><input id="newPass1" type="password"><div class="password-hint">הסיסמה חייבת להכיל לפחות 6 תווים.</div>
    <label>אימות סיסמה</label><input id="newPass2" type="password">
    <div class="actions">
      ${forced?"":`<button class="secondary" onclick="hideModal()">ביטול</button>`}
      <button class="primary" onclick="changeOwnPassword(this,${forced})">שמירה</button>
    </div>`);
}
async function changeOwnPassword(btn,forced){
  const p1=document.getElementById("newPass1").value,p2=document.getElementById("newPass2").value;
  if(p1.length<6)return alert("הסיסמה חייבת להכיל לפחות 6 תווים");
  if(p1!==p2)return alert("הסיסמאות אינן זהות");
  setBusy(btn,true,"שומר...");
  const {data,error}=await supabaseClient.functions.invoke("admin-users",{body:{action:"change_own_password",password:p1}});
  if(error||data?.error){setBusy(btn,false);return alert("לא ניתן לשנות סיסמה: "+(data?.error||error?.message||"שגיאה"));}
  currentUser.must_change_password=false;hideModal();alert("הסיסמה עודכנה בהצלחה");

function canAdmin(){return !!currentUser && (currentUser.role==="owner" || (currentUser.role==="admin" && currentUser.all_businesses_access===true))}
function roleLabel(r){return r==="owner"?"Owner":r==="admin"?"Admin":"Manager"}

async function loadProfiles(){
  const {data,error}=await supabaseClient.rpc("get_visible_profiles");
  if(error){console.error("get_visible_profiles",error);return false;}
  profilesById={};
  (data||[]).forEach(p=>{profilesById[p.id]=p});
  return true;
}

async function loadBusinesses(){
  const {data,error}=await supabaseClient.from("businesses").select("id,name,is_active,created_at,updated_at").order("id");
  if(error){console.error("loadBusinesses",error);return false;}
  businesses=data||[];
  const {data:members,error:me}=await supabaseClient.from("user_businesses").select("user_id,business_id");
  if(me){console.error("load memberships",me);userBusinesses=[];}else userBusinesses=members||[];
  const activeAllowed=availableBusinesses();
  const saved=localStorage.getItem("izazoo_current_business");
  if(currentUser.role==="owner"||currentUser.all_businesses_access){
    if(saved==="all") currentBusinessId="all";
    else if(activeAllowed.some(b=>String(b.id)===saved)) currentBusinessId=Number(saved);
    else currentBusinessId=activeAllowed[0]?.id??"all";
  }else{
    if(activeAllowed.some(b=>String(b.id)===saved)) currentBusinessId=Number(saved);
    else currentBusinessId=activeAllowed[0]?.id??null;
  }
  return true;
}

function availableBusinesses(){
  if(currentUser?.role==="owner" || currentUser?.all_businesses_access) return businesses.filter(b=>b.is_active);
  const ids=new Set(userBusinesses.filter(x=>x.user_id===currentUser?.id).map(x=>Number(x.business_id)));
  return businesses.filter(b=>b.is_active&&ids.has(Number(b.id)));
}
function businessName(id){return businesses.find(b=>Number(b.id)===Number(id))?.name||"עסק לא ידוע"}
function upsertById(list,row){
  const i=list.findIndex(x=>Number(x.id)===Number(row.id));
  if(i>=0)list[i]={...list[i],...row};else list.unshift(row);
}
function normalizeProblem(p){
  return {...p,reporter:profileName(p.created_by),
    date:p.created_at?p.created_at.slice(0,10):"",
    time:p.created_at?new Date(p.created_at).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}):""};
}


function visibleTasks(){
  if(currentBusinessId==="all") return tasks;
  return tasks.filter(t=>Number(t.business_id)===Number(currentBusinessId));
}

async function loadTasks(){
  const {data,error}=await supabaseClient
    .from("tasks")
    .select("id,description,business_id,created_by,created_at,assigned_to,due_date,status,completed_by,completed_at,completion_note,updated_at")
    .order("created_at",{ascending:false});
  if(error){
    console.error("loadTasks",error);
    return false;
  }
  tasks=data||[];
  return true;
}

function formatTaskDate(value){
  if(!value) return "";
  const d=new Date(value+"T12:00:00");
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function visibleProblems(){
  if(currentBusinessId==="all")return problems;
  return problems.filter(p=>Number(p.business_id)===Number(currentBusinessId));
}
function visibleActivity(){
  const ids=new Set(visibleProblems().map(p=>Number(p.id)));
  return problemActivity.filter(a=>ids.has(Number(a.problem_id)));
}
function profilesForBusiness(businessId){
  return Object.values(profilesById).filter(p=>(p.business_ids||[]).map(Number).includes(Number(businessId)));
}
function businessSelectorHTML(){
  const bs=availableBusinesses();
  if(!bs.length)return `<span class="business-static">אין עסק פעיל</span>`;
  if(bs.length===1&&!canAdmin())return `<span class="business-static">${esc(bs[0].name)}</span>`;
  return `<select class="business-select" onchange="switchBusiness(this.value)">
    ${canAdmin()?`<option value="all" ${currentBusinessId==="all"?"selected":""}>כל העסקים</option>`:""}
    ${bs.map(b=>`<option value="${b.id}" ${Number(currentBusinessId)===Number(b.id)?"selected":""}>${esc(b.name)}</option>`).join("")}
  </select>`;
}
function switchBusiness(value){
  currentBusinessId=value==="all"?"all":Number(value);
  localStorage.setItem("izazoo_current_business",String(currentBusinessId));
  if(currentScreen==="home")dashboard();
  else if(screenRenderers[currentScreen])screenRenderers[currentScreen]();
  else dashboard();
}

function animateRootOut(direction){
  const child=root().firstElementChild;
  if(!child||!child.animate)return Promise.resolve();
  child.style.willChange="transform";
  const anim=child.animate(
    [{transform:"translate3d(0,0,0)"},{transform:`translate3d(${direction==="forward"?"100%":"-100%"},0,0)`}],
    {duration:185,easing:"cubic-bezier(.4,0,.2,1)",fill:"both"}
  );
  return anim.finished.catch(()=>{}).finally(()=>{
    child.style.transform="";
    child.style.willChange="";
    anim.cancel();
  });
}
function animateRootIn(direction){
  const child=root().firstElementChild;
  if(!child||!child.animate)return;
  child.style.willChange="transform";
  const anim=child.animate(
    [{transform:`translate3d(${direction==="forward"?"-100%":"100%"},0,0)`},{transform:"translate3d(0,0,0)"}],
    {duration:200,easing:"cubic-bezier(.2,.8,.2,1)",fill:"both"}
  );
  anim.finished.catch(()=>{}).finally(()=>{
    child.style.transform="";
    child.style.willChange="";
    anim.cancel();
  });
}

const moduleNames=new Set(["problems","tasks","updates","docs"]);
let calendarReturnDate=null;
let exitConfirmOpen=false;
let pendingExitBacks=0;

async function renderNamedScreen(name){
  const fn=screenRenderers[name]||screenRenderers.home;
  return await fn();
}
async function goToScreen(name,{push=true,direction="forward"}={}){
  if(!screenRenderers[name])name="home";
  if(currentScreen===name){await renderNamedScreen(name);return;}
  const animate=moduleNames.has(currentScreen)||moduleNames.has(name);
  if(animate)await animateRootOut(direction);
  previousScreen=currentScreen;currentScreen=name;
  await renderNamedScreen(name);
  if(animate)animateRootIn(direction);
  if(push)history.pushState({izazoo:true,view:name},"",`#${name}`);
}
function navigateModule(name,push=true){return goToScreen(name,{push,direction:"forward"});}
function navigateHome(push=true,backAnimation=true){return goToScreen("home",{push,direction:backAnimation?"back":"forward"});}
function appBack(){history.back();}
function initAppHistory(){
  history.replaceState({izazoo:true,exitGuard:true},"","#izazoo-exit");
  history.pushState({izazoo:true,view:"home"},"","#home");
  currentScreen="home";appHistoryReady=true;
}
function showExitConfirmation(){
  if(exitConfirmOpen)return;
  exitConfirmOpen=true;
  showModal(`<div class="confirm-card"><h2>לצאת מ־IzaZoo?</h2><p class="u-sub">האם לצאת מהאפליקציה?</p><div class="actions"><button class="secondary" onclick="cancelAppExit()">ביטול</button><button class="danger-action" onclick="confirmAppExit()">יציאה</button></div></div>`,{exitModal:true});
}
function cancelAppExit(){
  exitConfirmOpen=false;document.getElementById("modal")?.remove();
  currentScreen="home";
}
function confirmAppExit(){
  exitConfirmOpen=false;
  document.getElementById("modal")?.remove();
  pendingExitBacks=2; // pop the safety-net entry, then the original home entry, then exit
  history.back();
}
function closeModalSmart(){
  if(calendarReturnDate){const ds=calendarReturnDate;calendarReturnDate=null;hideModal();goToScreen("home",{push:false,direction:"back"}).then(()=>calendarDay(ds));return;}
  hideModal();
}
window.addEventListener("popstate",async e=>{
  if(pendingExitBacks>0){
    pendingExitBacks--;
    history.back();
    return;
  }
  const modal=document.getElementById("modal");
  if(modal&&exitConfirmOpen){
    // physical back pressed while the exit-confirm dialog is open -> cancel, stay in the app
    exitConfirmOpen=false;
    modal.remove();
    currentScreen="home";
    return;
  }
  if(modal&&!exitConfirmOpen){
    modal.remove();calendarReturnDate=null;
    history.pushState({izazoo:true,view:currentScreen},"",`#${currentScreen}`);
    return;
  }
  if(e.state?.exitGuard){
    if(!currentUser)return; // not logged in yet (e.g. login screen) - nothing to protect, let it behave normally
    history.pushState({izazoo:true,view:"home"},"","#home"); // push the safety net FIRST, before any rendering, to close the race window
    currentScreen="home";dashboard();showExitConfirmation();return;
  }
  const target=e.state?.view;
  if(target){
    if(target!==currentScreen)await goToScreen(target,{push:false,direction:"back"});
    return;
  }
  if(currentUser){initAppHistory();dashboard();}
});

function searchBoxHTML(context){

}
function removeSearchResultsForBox(box){if(box?.nextElementSibling?.classList?.contains("search-results-panel"))box.nextElementSibling.remove();}
function clearSearch(context,button){const box=button?.closest(".stable-search")||document.querySelector(`.stable-search[data-search-box="${context}"]`),input=box?.querySelector("input");removeSearchResultsForBox(box);if(input){input.value="";input.focus();}}
function searchMatches(context,q){
  const matches=[];
  const push=(type,id,label,primary,secondary="")=>{
    const hay=(String(primary||"")+" "+String(secondary||"")).toLowerCase();
    if(hay.includes(q))matches.push({type,id,label,text:String(primary||"")});
  };
  if(context==="home"||context==="problems")visibleProblems().forEach(x=>push("problem",x.id,"תקלה",x.title,x.description||""));
  if(context==="home"||context==="tasks")visibleTasks().forEach(x=>push("task",x.id,"משימה",x.description));
  if(context==="home"||context==="updates")visibleUpdates(false).forEach(x=>push("update",x.id,"עדכון",x.body));
  return matches;
}
function renderSearchResults(context,q,sourceInput){
  const box=sourceInput?.closest(".stable-search");if(!box)return;removeSearchResultsForBox(box);q=(q||"").trim().toLowerCase();if(!q)return;
  const matches=searchMatches(context,q);
  const html=matches.length?matches.slice(0,20).map(r=>`<button type="button" class="search-result-row" onclick="openSearchResult('${r.type}',${Number(r.id)})"><span>${r.label}</span><strong>${esc(r.text)}</strong></button>`).join(""):`<div class="search-empty">לא נמצאו תוצאות</div>`;
  box.insertAdjacentHTML("afterend",`<div class="home-search-results search-results-panel">${html}</div>`);
}
function liveSearch(context,q,input){if((q||"").trim().length>=2)renderSearchResults(context,q,input);else removeSearchResultsForBox(input?.closest(".stable-search"));}
function submitSearch(context,input){renderSearchResults(context,input?.value||"",input);input?.blur();}
async function openSearchResult(type,id){
  document.querySelectorAll(".search-results-panel").forEach(el=>el.remove());
  if(type==="problem"){if(currentScreen!=="problems")await goToScreen("problems",{push:true,direction:"forward"});return openProblemDetails(id);}
  if(type==="task"){if(currentScreen!=="tasks")await goToScreen("tasks",{push:true,direction:"forward"});return openTaskDetails(id);}
  if(type==="update"){if(currentScreen!=="updates")await goToScreen("updates",{push:true,direction:"forward"});return focusUpdateThread(id);}
}

function calendarHTML(mobile){
  const y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),title=first.toLocaleDateString("he-IL",{month:"long",year:"numeric"}),items=calendarItems();let cells="",offset=first.getDay();
  for(let i=offset-1;i>=0;i--){const d=new Date(y,m,-i);cells+=`<div class="day other"><div class="day-num">${d.getDate()}</div></div>`;}
  for(let d=1;d<=last.getDate();d++){const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,its=items.filter(x=>x.date===ds),types=[...new Set(its.map(x=>x.type))],markers=types.map(t=>`<i class="calendar-marker ${t}"></i>`).join("");cells+=`<div class="day ${ds===isoToday()?"today":""} ${its.length?"has-items":""}" onclick="calendarDay('${ds}')"><div class="day-num">${d}</div><div class="calendar-markers">${markers}</div><div class="events">${its.slice(0,3).map(x=>`<div class="event-pill ${typeClass(x.type)}">${typeIcon(x.type)} ${esc(x.title)}</div>`).join("")}</div></div>`;}
  while((offset+last.getDate())%7!==0){const n=(offset+last.getDate())%7,d=7-n;for(let i=1;i<=d;i++)cells+=`<div class="day other"><div class="day-num">${i}</div></div>`;break;}
  return `<div class="panel-head calendar-toolbar"><div class="month-label">${title}</div><div class="spacer"></div><div class="controls"><button class="small-btn" onclick="prevMonth()">›</button><button class="small-btn" onclick="todayMonth()">היום</button><button class="small-btn" onclick="nextMonth()">‹</button></div></div><div class="week">${["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"].map(x=>`<div>${x}</div>`).join("")}</div><div class="calendar">${cells}</div>`;
}

    .filter(t=>t.status==="done")

async function createTask(btn){
  const description=document.getElementById("taskDescription").value.trim();
  if(!description)return alert("יש להזין את המשימה");
  if(currentBusinessId==="all"||!currentBusinessId)return alert("יש לבחור עסק");

  setBusy(btn,true,"יוצר...");

  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user){
    setBusy(btn,false);
    return alert("החיבור פג. יש להתחבר מחדש.");
  }

  const payload={
    description,
    business_id:Number(currentBusinessId),
    created_by:user.id,
    assigned_to:document.getElementById("taskAssignee").value||null,
    due_date:document.getElementById("taskDue").value||null
  };

  const {data,error}=await supabaseClient.from("tasks").insert(payload)
    .select("id,description,business_id,created_by,created_at,assigned_to,due_date,status,completed_by,completed_at,completion_note,updated_at").single();

  if(error){
    setBusy(btn,false);
    console.error(error);
    return alert("לא ניתן ליצור את המשימה: "+error.message);
  }

  if(data)upsertById(tasks,data);
  hideModal();tasksScreen();
}

async function saveTaskEdit(id,btn){

  setBusy(btn,true,"שומר...");

  const payload={
    description,
    assigned_to:document.getElementById("editTaskAssignee").value||null,
    due_date:document.getElementById("editTaskDue").value||null,
    updated_at:new Date().toISOString()
  };

  const {data,error}=await supabaseClient.from("tasks").update(payload).eq("id",id)
    .select("id,description,business_id,created_by,created_at,assigned_to,due_date,status,completed_by,completed_at,completion_note,updated_at").single();

  if(error){
    setBusy(btn,false);

  const calls=[supabaseClient.rpc("admin_set_profile_identity",{target_user:uid,new_first_name:first,new_last_name:last})];
  if(role!==p.role)calls.push(supabaseClient.rpc("admin_set_user_role",{target_user:uid,new_role:role}));
  if(active!==(p.is_active!==false))calls.push(supabaseClient.rpc("admin_set_user_active",{target_user:uid,new_active:active}));
  calls.push(supabaseClient.rpc("admin_set_all_businesses_access",{target_user:uid,new_value:global}));
  if(!global){
    for(const bid of desired)if(!current.has(bid))calls.push(supabaseClient.rpc("admin_add_user_to_business",{target_user:uid,target_business:bid}));
    for(const bid of current)if(!desired.includes(bid))calls.push(supabaseClient.rpc("admin_remove_user_from_business",{target_user:uid,target_business:bid}));
  }
  const results=await Promise.all(calls);
  const failed=results.find(x=>x.error);
  if(failed){setBusy(btn,false);return toast("חלק מההרשאות לא עודכנו","error");}
  await loadProfiles();await loadAdminData();hideModal();toast("המשתמש עודכן");adminScreen();
}

function syncVisualViewport(){const vv=window.visualViewport,h=vv?.height||window.innerHeight,top=vv?.offsetTop||0,keyboard=Math.max(0,window.innerHeight-h-top);document.documentElement.style.setProperty("--app-vvh",h+"px");document.documentElement.style.setProperty("--app-vvtop",top+"px");document.documentElement.style.setProperty("--keyboard-inset",keyboard+"px");}
function focusFieldIntoView(target){if(!target||!target.matches("input,textarea,select"))return;setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"center",inline:"nearest"}),180);}
window.visualViewport?.addEventListener("resize",syncVisualViewport);window.visualViewport?.addEventListener("scroll",syncVisualViewport);document.addEventListener("focusin",e=>focusFieldIntoView(e.target));syncVisualViewport();
function showModal(inner,options={}){document.getElementById("modal")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal" data-exit-modal="${options.exitModal?"1":"0"}"><div class="modal-card">${inner}</div></div>`);syncVisualViewport();}
function hideModal(){const modal=document.getElementById("modal");if(!modal){calendarReturnDate=null;return;}const card=modal.querySelector(".modal-card");if(card?.animate){card.animate([{opacity:1,transform:"translateY(0) scale(1)"},{opacity:0,transform:"translateY(7px) scale(.97)"}],{duration:110,easing:"ease-in"});modal.animate([{opacity:1},{opacity:0}],{duration:110,easing:"ease-in"});}modal.remove();calendarReturnDate=null;}
function setBusy(btn,busy,label=""){
  if(!btn)return;
  if(busy){
    if(!btn.dataset.originalText)btn.dataset.originalText=btn.textContent;
    btn.disabled=true;if(label)btn.textContent=label;
  }else{
    btn.disabled=false;if(btn.dataset.originalText){btn.textContent=btn.dataset.originalText;delete btn.dataset.originalText;}
  }
}

function calendarDay(ds){
  const its=calendarItems().filter(x=>x.date===ds);
  const date=new Date(ds+"T12:00:00");
  const title=date.toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"});
  showModal(`<h2>${esc(title)}</h2>
    ${its.length
      ? its.map(x=>`<button type="button" class="list-card calendar-linked-item calendar-${x.type}" onclick="openCalendarItem('${x.type}',${Number(x.id)},'${ds}')"><strong>${typeIcon(x.type)} ${esc(x.title)}</strong><div class="item-meta">${x.time||""}</div></button>`).join("")
      : `<div class="item-meta">אין פריטים בתאריך זה</div>`}
    <div class="actions"><button class="secondary" onclick="hideModal()">סגור</button></div>`);
}
async function openCalendarItem(type,id,ds){const module=type==="problem"?"problems":type==="task"?"tasks":type==="update"?"updates":null;if(!module)return;hideModal();calendarReturnDate=ds;await goToScreen(module,{push:true,direction:"forward"});if(type==="problem")openProblemDetails(id);if(type==="task")openTaskDetails(id);if(type==="update")setTimeout(()=>focusUpdateThread(id),60);}

function applyViewportMode(){
  const mode=window.matchMedia("(orientation: portrait)").matches?"portrait":"landscape";
  const changed=lastViewportMode!==null && lastViewportMode!==mode;
  lastViewportMode=mode;
  document.body.classList.toggle("is-portrait",mode==="portrait");
  document.body.classList.toggle("is-landscape",mode==="landscape");
  return changed;
}
window.addEventListener("resize",()=>{applyViewportMode();});
window.addEventListener("orientationchange",()=>setTimeout(()=>{const changed=applyViewportMode();if(changed&&currentUser){if(currentScreen==="home")dashboard();else moduleRenderers[currentScreen]?.();}},180));
applyViewportMode();

<script>

let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();deferredInstallPrompt=ev;});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;document.getElementById("installOffer")?.remove();});
function runningStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}
function maybeShowInstallOffer(){
  if(runningStandalone()||document.getElementById("installOffer"))return;
  document.body.insertAdjacentHTML("beforeend",`<div class="install-offer" id="installOffer"><div class="install-offer-copy"><strong>IzaZoo</strong><span>מומלץ להתקין את האפליקציה לשימוש נוח ומהיר.</span></div><div class="install-offer-actions"><button type="button" class="primary" onclick="installIzaZoo()">התקנת האפליקציה</button><button type="button" class="secondary" onclick="continueOnWebsite()">המשך באתר</button></div></div>`);
}
async function installIzaZoo(){
  if(!deferredInstallPrompt){toast("אפשר להתקין דרך תפריט הדפדפן → התקנת אפליקציה","info");return;}
  deferredInstallPrompt.prompt();const choice=await deferredInstallPrompt.userChoice;
  if(choice.outcome==="accepted")document.getElementById("installOffer")?.remove();
  deferredInstallPrompt=null;
}
function continueOnWebsite(){document.getElementById("installOffer")?.remove();}
window.addEventListener("load",()=>setTimeout(maybeShowInstallOffer,250));

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
}
</script>
