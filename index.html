<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IzaZoo — מרכז ניהול</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button{cursor:pointer}
body{min-height:100vh}
.app-shell{min-height:100vh}
.desktop-layout{display:grid;grid-template-columns:270px 320px minmax(0,1fr);min-height:100vh}
.sidebar{color:#fff;padding:28px 18px 18px;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column
}
.brand{padding:0 12px 28px}
.brand-name{font-family:Georgia,serif;font-size:38px;color:var(--gold);line-height:1}
.brand-sub{margin-top:9px;color:#e7ebf0;font-size:17px}
.section-label{font-size:11px;color:#8d9caf;margin:2px 12px 9px;letter-spacing:.08em}
.nav-list{display:flex;flex-direction:column;gap:9px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:13px;color:#fff;padding:14px 13px;text-align:right
}
.nav-btn .ico{width:26px;text-align:center;font-size:21px}.nav-btn .txt{display:flex;flex-direction:column;gap:2px}
.nav-btn .name{font-size:15px}.nav-btn .sub{font-size:11px}
.badge{margin-inline-start:auto;min-width:27px;height:27px;padding:0 7px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.red{background:var(--red)}.blue{background:var(--blue)}.green{background:var(--green)}.purple{background:var(--purple)}
.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:15px}
.profile{display:flex;align-items:center;gap:10px}.avatar{width:43px;height:43px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800}
.profile-role{font-size:11px}
.middle{
  padding:24px 16px;overflow:auto
}
.middle h2{font-size:20px;margin:0 0 14px}
.quick{border:1px solid #e2e5ea;background:#fff;border-radius:11px;padding:10px;font-weight:800}
.item-title{font-size:14px}.item-meta{font-size:11px;margin-top:3px;line-height:1.5}
.main{padding:24px 26px 28px;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.greeting{margin-inline-end:auto}.greeting h1{margin:0 0 4px;font-size:26px}.date{font-size:14px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.panel-head h2{margin:0;font-size:23px}.spacer{margin-inline-start:auto}.month-label{font-weight:800}
.controls{display:flex;gap:7px}.small-btn{padding:7px 10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:5px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr)}
.day{min-height:105px;padding:9px;border-left:1px solid #edf0f4;border-bottom:1px solid #edf0f4;cursor:pointer}
.day:nth-child(7n){border-left:0}.day.other{color:#b3bac4}.events{display:flex;flex-direction:column;gap:4px;margin-top:9px}.event-pill{font-size:10px;border-radius:7px;padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* portrait */
.mobile-layout{display:none;padding:14px 12px 22px}
body.is-portrait .module-problems .mobile-layout,body.is-portrait .module-tasks .mobile-layout,body.is-portrait .module-updates .mobile-layout,body.is-portrait .module-docs .mobile-layout{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.mobile-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.mobile-header .greeting{flex:1}
.mobile-brand{color:#b68b38;font-size:25px}

/* common pages/modals */
.modal{position:fixed;display:flex;justify-content:center;z-index:50}
.modal-card{width:min(620px,100%);overflow:auto;padding:20px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,textarea,select{width:100%;padding:11px}
textarea{min-height:110px}
.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}
.primary{padding:11px 14px;font-weight:800}
.secondary{padding:11px 14px;font-weight:800}
.list-card{padding:14px;margin-top:10px}
.fab{position:fixed;left:24px;bottom:24px;padding:12px 15px;font-weight:800}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(420px,100%);padding:28px}
.login-brand{text-align:center}.login-sub{text-align:center;margin-bottom:20px}

body.is-portrait .desktop-layout{display:none !important}
body.is-portrait .mobile-layout{display:block !important}
body.is-landscape .desktop-layout{display:grid !important}
body.is-landscape .mobile-layout{display:none !important}
@media(max-width:900px) and (orientation:landscape){
  .desktop-layout{grid-template-columns:180px 240px minmax(0,1fr)}
  .sidebar{padding:18px 10px}.brand-name{font-size:28px}.brand-sub{font-size:14px}.nav-btn{padding:10px 8px}.nav-btn .sub{display:none}
  .middle{padding:14px 10px}.main{padding:14px 12px}.day{min-height:72px;padding:5px}.event-pill{display:none}.greeting h1{font-size:20px}
}
.middle{height:100vh;overflow-y:auto;scrollbar-gutter:stable}
.sidebar{overflow-y:auto}
.sidebar .nav-btn{
  border-color:var(--line);
}
.quick{transition:.15s ease}
.quick:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,23,42,.06)}


/* Unified visual language: landscape matches portrait */
.sidebar{
  background:linear-gradient(180deg,var(--nav),var(--nav2));
}
.nav-btn{
  border:1px solid rgba(255,255,255,.055);
  background:rgba(255,255,255,.03);
  border-radius:14px;
}
.nav-btn:hover,.nav-btn.active{
  background:rgba(221,185,111,.15);
  border-color:rgba(221,185,111,.2);
}
.middle{
  background:var(--bg);
  border-left:1px solid var(--line);
  padding-top:24px;
}
.mobile-list-item{
  border-color:#edf0f3;
}
.item-title{
  color:var(--text);
}


/* Portrait dashboard — fixed right categories, full-width header over feed + calendar */
body.is-portrait .portrait-dashboard{
    display:grid !important;
    grid-template-columns:112px minmax(0,1fr);
    min-height:100vh;
    padding:0;
    background:var(--bg);
  }

@media (max-width:560px){
  body.is-portrait .portrait-dashboard{grid-template-columns:92px minmax(0,1fr)}
}


/* Landscape mirrors Portrait exactly: same hierarchy, same visual language */
body.is-landscape .mirrored-landscape{
  display:grid !important;
  grid-template-columns:126px minmax(0,1fr);
}
body.is-landscape .landscape-sidebar{
  grid-column:1;
  grid-row:1;
  height:100vh;
  overflow-y:auto;
  color:#fff;
  padding:18px 10px 14px;
  display:flex;
  flex-direction:column;
}
body.is-landscape .landscape-brand{
  text-align:center;
  margin:2px 0 20px;
}
body.is-landscape .landscape-nav{
  flex-direction:column;
}
body.is-landscape .landscape-cat{
  position:relative;
  padding:10px 5px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
body.is-landscape .landscape-cat-icon{font-size:22px;line-height:1}
body.is-landscape .landscape-cat-count{
  position:absolute;
  top:5px;
  left:6px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
}
body.is-landscape .landscape-cat.problem{box-shadow:inset -3px 0 0 var(--red)}
body.is-landscape .landscape-cat.update{box-shadow:inset -3px 0 0 var(--blue)}
body.is-landscape .landscape-cat.task{box-shadow:inset -3px 0 0 var(--green)}
body.is-landscape .landscape-cat.doc{box-shadow:inset -3px 0 0 var(--purple)}
body.is-landscape .landscape-user{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.09);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:800;
}
body.is-landscape .landscape-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
}
body.is-landscape .landscape-workspace{
  grid-column:2;
  grid-row:1;
  min-width:0;
  padding:16px 16px 20px;
}
body.is-landscape .landscape-header{
  width:100%;
  margin-bottom:12px;
}
body.is-landscape .landscape-content{
  display:grid;
  grid-template-columns:minmax(210px,.72fr) minmax(0,1.7fr);
  gap:12px;
  direction:rtl;
}
body.is-landscape .landscape-feed{
  grid-column:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:12px;
}
body.is-landscape .landscape-calendar-card{
  grid-column:2;
  min-width:0;
}
body.is-landscape .landscape-card .item-title{font-size:12px}
body.is-landscape .landscape-card .item-meta{font-size:10px}
body.is-landscape .landscape-calendar-card .panel-head{
  flex-wrap:wrap;
}
body.is-landscape .landscape-calendar-card .small-btn{font-size:10px;padding:5px 6px}
body.is-landscape .landscape-calendar-card .week{font-size:9px}
body.is-landscape .landscape-calendar-card .day{min-height:62px;padding:4px;font-size:10px}
body.is-landscape .landscape-calendar-card .event-pill{
  display:block;
  font-size:9px;
  padding:3px 4px;
}
@media (max-height:520px) and (orientation:landscape){
  body.is-landscape .mirrored-landscape{grid-template-columns:106px minmax(0,1fr)}
  body.is-landscape .landscape-sidebar{padding:10px 7px}
  body.is-landscape .landscape-brand{font-size:20px;margin-bottom:10px}
  body.is-landscape .landscape-cat{min-height:56px;padding:6px 3px}
  body.is-landscape .landscape-cat-icon{font-size:18px}
  body.is-landscape .landscape-cat-name{font-size:9px}
  body.is-landscape .landscape-user{display:none}
  body.is-landscape .landscape-workspace{padding:9px 9px 12px}
  body.is-landscape .landscape-header{padding:10px;margin-bottom:8px}
  body.is-landscape .landscape-header h1{font-size:17px}
  body.is-landscape .landscape-date{font-size:10px;margin-bottom:7px}
  body.is-landscape .landscape-content{grid-template-columns:minmax(185px,.65fr) minmax(0,1.75fr);gap:8px}
  body.is-landscape .landscape-card,
  body.is-landscape .landscape-calendar-card{padding:8px;border-radius:13px}
  body.is-landscape .landscape-card h3{font-size:13px}
  body.is-landscape .landscape-card .mobile-list-item{padding:6px 0}
  body.is-landscape .landscape-calendar-card .day{min-height:43px;padding:2px}
  body.is-landscape .landscape-calendar-card .event-pill{display:none}
}


/* Portrait-only layout from sketch. Landscape is intentionally untouched. */
body.is-portrait .portrait-single-column{
  display:block !important;
  min-height:100vh;
  padding:0;
  background:var(--bg);
}
body.is-portrait .portrait-single-calendar{
  margin-bottom:12px;
}
body.is-portrait .portrait-single-calendar .panel-head{
  flex-wrap:wrap;
}
body.is-portrait .portrait-single-calendar .week{
  font-size:10px;
}
body.is-portrait .portrait-single-calendar .day{
  min-height:58px;
  padding:5px;
  font-size:11px;
}
body.is-portrait .portrait-single-calendar .event-pill{
  display:none;
}
body.is-portrait .portrait-single-card{
  margin-bottom:12px;
}
body.is-portrait .portrait-single-card .mobile-list-item{
  padding:11px 0;
}
body.is-portrait .portrait-single-card .item-title{
  font-size:13px;
}
body.is-portrait .portrait-single-card .item-meta{
  font-size:11px;
}
body.is-portrait .portrait-bottom-nav{
  position:fixed;
  right:0;
  left:0;
  bottom:0;
  z-index:40;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  background:rgba(16,32,51,.97);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
}
body.is-portrait .portrait-bottom-cat{
  border:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}
body.is-portrait .portrait-bottom-cat:active{
  background:rgba(255,255,255,.08);
}
body.is-portrait .portrait-bottom-count{
  position:absolute;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
}
@media (orientation:portrait) and (max-width:430px){
  body.is-portrait .portrait-single-header,
  body.is-portrait .portrait-single-calendar,
  body.is-portrait .portrait-single-card{
    border-radius:14px;
  }
  body.is-portrait .portrait-single-header{
    padding:13px;
  }
  body.is-portrait .portrait-single-header h1{
    font-size:20px;
  }
  body.is-portrait .portrait-single-calendar{
    padding:9px;
  }
  body.is-portrait .portrait-single-calendar .day{
    min-height:49px;
    padding:3px;
  }
}


/* v9 Portrait: header + category bar stay fixed; content below scrolls */
body.is-portrait{
  overflow:hidden;
}
body.is-portrait .portrait-single-column{
  height:100vh;
  overflow:hidden;
}
body.is-portrait .portrait-single-workspace{
  height:100vh;
  min-height:0;
  padding:10px 10px 0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
body.is-portrait .portrait-single-header{
  flex:0 0 auto;
  z-index:42;
}
body.is-portrait .portrait-category-bar{
  position:relative;
  right:auto;
  left:auto;
  bottom:auto;
  flex:0 0 auto;
  z-index:41;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  width:100%;
  backdrop-filter:blur(12px);
}
body.is-portrait .portrait-category-bar .portrait-bottom-cat{
  min-height:55px;
}
body.is-portrait .portrait-scroll-content{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:0 2px 18px;
}
body.is-portrait .portrait-single-calendar{
  margin-top:0;
}
@media (orientation:portrait) and (max-width:430px){
  body.is-portrait .portrait-single-workspace{
    padding:8px 8px 0;
  }
  body.is-portrait .portrait-category-bar{
    margin-bottom:7px;
    padding:5px 6px;
  }
  body.is-portrait .portrait-category-bar .portrait-bottom-cat{
    min-height:51px;
  }
}

:root{
  --panel-soft:#f8fafc;

}
.login-card,.portrait-single-header,.portrait-single-calendar,.portrait-single-card{
  border-color:var(--line);
}
.login-brand,.brand-name,.mobile-brand,.landscape-brand{
  letter-spacing:.01em;
  font-weight:500;
}
.item-title,.nav-btn .name,.portrait-bottom-name{
  letter-spacing:-.01em;
}

/* portrait header */

  margin-bottom:6px;
}

}

  margin-bottom:1px;
}
body.is-portrait .portrait-bottom-cat.problem{box-shadow:inset 0 -2px 0 var(--red)}

/* =========================================================
   v11 — Premium SaaS visual system
   Structure intentionally unchanged.
   ========================================================= */

:root{
  --bg-2:#f7f9fc;
  --panel:#ffffff;
  --panel-2:#fbfcfe;
  --line-strong:#d6dde7;
  --text:#0d1726;
  --text-2:#243247;

  --nav:#0b1726;
  --nav-2:#10233a;
  --nav-3:#17304c;
  --gold-2:#f0ddb1;

  --shadow-xs:0 1px 2px rgba(15,23,42,.03);
  --shadow-sm:0 8px 20px rgba(15,23,42,.05);
  --shadow-md:0 16px 40px rgba(15,23,42,.075);
  --shadow-nav:0 18px 40px rgba(7,16,29,.24);
}

::selection{
  background:#dbeafe;
  color:#0f172a;
}

/* ---------- Global card language ---------- */

/* ---------- Premium typography ---------- */

.item-title,.nav-btn .name,.portrait-bottom-name,.landscape-cat-name{
  font-weight:750;
}

.item-meta,
.date,
.profile-role,
.nav-btn .sub,
.portrait-single-date,
.landscape-date{
  color:var(--muted);
}

/* ---------- Inputs ---------- */

input,textarea,select{
  transition:.18s ease;
}

/* ---------- Buttons ---------- */

button{
  transition:
    transform .12s ease,
    background .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}

button:hover{
  filter:brightness(.99);
}

button:active{
  transform:translateY(1px);
}

/* =========================================================
   PORTRAIT
   ========================================================= */

body.is-portrait .portrait-single-header{
  border-color:#dde4ed;
}

body.is-portrait .portrait-single-header:before{
  inset:0 auto 0 0;
}

/* Category bar becomes a true premium navigation dock */

body.is-portrait .portrait-bottom-cat{
  overflow:hidden;
}

body.is-portrait .portrait-bottom-cat:before{
  content:"";
  position:absolute;
  inset:auto 18% 0;
  height:2px;
  border-radius:99px;
  opacity:.95;
}

body.is-portrait .portrait-bottom-cat.problem:before{background:var(--red)}
body.is-portrait .portrait-bottom-cat.update:before{background:var(--blue)}
body.is-portrait .portrait-bottom-cat.task:before{background:var(--green)}
body.is-portrait .portrait-bottom-cat.doc:before{background:var(--purple)}

body.is-portrait .portrait-bottom-icon{
  line-height:1;
}

/* Calendar */

body.is-portrait .portrait-single-calendar{
  border-color:#dfe5ed;
}

.calendar{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}

/* Open items / activity */

body.is-portrait .portrait-single-card{
  border-color:#e0e6ed;
}

body.is-portrait .portrait-single-card h3:after{
  content:"";
  width:34px;
  height:3px;
  margin-top:7px;
  border-radius:99px;
  background:linear-gradient(90deg,var(--gold),#ead7a7);
}

/* =========================================================
   LANDSCAPE — same visual language, same structure
   ========================================================= */

body.is-landscape .landscape-cat{
  transition:.15s ease;
}

body.is-landscape .landscape-header{
  border-color:#dde4ed;
}

body.is-landscape .landscape-header:before{
  inset:0 auto 0 0;
}

body.is-landscape .landscape-card,
body.is-landscape .landscape-calendar-card{
  border-color:#e0e6ed;
}

/* Scroll polish */

body.is-portrait .portrait-scroll-content::-webkit-scrollbar,
body.is-landscape .landscape-sidebar::-webkit-scrollbar{
  width:5px;
}

body.is-portrait .portrait-scroll-content::-webkit-scrollbar-thumb,
body.is-landscape .landscape-sidebar::-webkit-scrollbar-thumb{
  background:#c9d3df;
  border-radius:99px;
}

   v12 — Full visual redesign
   Inspired by modern SaaS patterns (Linear / Stripe class of UI)
   STRUCTURE UNCHANGED
   ========================================================= */

:root{
  --bg-alt:#f1f2ef;
  --surface-2:#fafaf8;
  --surface-3:#f3f4f1;

  --stroke:#e6e6e1;
  --stroke-strong:#d8d9d3;

  --sidebar:#171a1f;
  --sidebar-2:#1d2229;
  --sidebar-soft:#242a32;
  --accent-2:#9b90ff;

  --danger:#d94d55;
  --danger-soft:#fff0f1;
  --info:#3978d5;
  --info-soft:#eff5ff;
  --success:#2f8f5b;
  --success-soft:#edf8f1;
  --warn:#c4882c;
  --warn-soft:#fff7e8;

  --radius-xs:8px;
  --radius-sm:11px;

  --shadow-1:0 1px 2px rgba(0,0,0,.025);
  --shadow-2:0 6px 18px rgba(20,24,30,.045);
  --shadow-3:0 18px 44px rgba(20,24,30,.07);
}

body{
  font-size:14px;
  line-height:1.45;
}

button,input,textarea,select{
  font:inherit;
}

/* global surfaces */

/* forms */

input:hover,textarea:hover,select:hover{
  border-color:#c8cac4;
}

/* buttons */
.small-btn:hover{
  background:var(--surface-3);

<script>
// Back-button handling: see ensureExitGuard(). History entries are only added
// after the user taps something, because Chrome's back button skips entries

function showStartupError(message){
  document.getElementById("root").innerHTML=`<div class="login-wrap"><div class="login-card"><div class="login-brand">IzaZoo</div><div style="margin:12px 0;font-size:14px">${message}</div><button class="primary" style="width:100%" onclick="location.reload()">נסה שוב</button></div></div>`;
}
if(!window.supabase){
  showStartupError("לא ניתן לטעון את IzaZoo. בדוק את החיבור לרשת ונסה שוב.");
  throw new Error("supabase library failed to load");
}
const SUPABASE_URL = "https://ocfbgppfpvjfhclpdtao.supabase.co";
const SUPABASE_KEY = "sb_publishable_tfvkgoOZ5hDt947woGQdSw_PLAaaIa-";
let lastNetworkActivity=0;
let lastFetchProblem=""; // why the last request to the server failed (shown in error messages)
const FETCH_TIMEOUT_MS=20000;
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY,{
  global:{fetch:(url,options={})=>{
    lastNetworkActivity=Date.now();
    // give up on requests the server never answers, instead of waiting forever
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),FETCH_TIMEOUT_MS);
    if(options.signal){if(options.signal.aborted)ctrl.abort();else options.signal.addEventListener("abort",()=>ctrl.abort(),{once:true});}
    return fetch(url,{...options,cache:"no-store",signal:ctrl.signal})
      .then(r=>{lastNetworkActivity=Date.now();lastFetchProblem=r.status>=500?`HTTP ${r.status}`:"";return r;})
      .catch(e=>{lastNetworkActivity=Date.now();lastFetchProblem=ctrl.signal.aborted?"timeout":String(e?.message||e);throw e;})
      .finally(()=>clearTimeout(timer));
  }}
});
const serverProblemText=()=>"אין תשובה משרת הנתונים של IzaZoo. בדוק את החיבור לרשת ונסה שוב."+(lastFetchProblem?`<div style="margin-top:8px;font-size:11px;color:#888" dir="ltr">${String(lastFetchProblem).replace(/[&<>]/g,"")}</div>`:"");
const root=()=>document.getElementById("root"),
esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),
localDay=v=>{if(!v)return"";const d=v instanceof Date?v:new Date(v);if(Number.isNaN(d.getTime()))return"";return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;},
isoToday=()=>localDay(new Date()),
save=()=>{};
const fmtDate=s=>{if(!s)return"";const [y,m,d]=s.split("-");return `${d}/${m}`};
const fmtFull=()=>new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function counts(){
  return {
    p:visibleProblems().filter(x=>x.status!=="closed").length,
    u:visibleUpdates(false).length,
    t:visibleTasks().filter(x=>x.status!=="done").length,

  };
}



async function login(message=""){
  selectedLoginUsername="";
  root().innerHTML=`<div class="login-wrap"><div class="login-card">
    <div class="login-brand">IzaZoo</div><div class="login-sub">מרכז ניהול</div>
    ${message?`<div style="margin:0 0 12px;padding:10px;border:1px solid #d8d5cd;background:#f7f5ef;font-size:13px">${esc(message)}</div>`:""}
    <label>שם משתמש</label><input id="lu" type="text" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')document.getElementById('lp')?.focus()">
    <label>סיסמה</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="primary" id="loginBtn" style="width:100%;margin-top:16px" onclick="doLogin()">כניסה</button>
  </div></div>`;
  setTimeout(()=>document.getElementById("lu")?.focus(),50);
}

async function doLogin(){
  const btn=document.getElementById("loginBtn");
  const username=(document.getElementById("lu")?.value||"").trim().toLowerCase();
  const password=document.getElementById("lp")?.value||"";
  if(!username||!password)return alert("יש להזין שם משתמש וסיסמה");
  btn.disabled=true;btn.textContent="מתחבר...";
  const {data,error}=await supabaseClient.auth.signInWithPassword({email:`${username}@izazoo.local`,password});
  if(error){
    btn.disabled=false;btn.textContent="כניסה";
    const wrongDetails=error.status===400||error.code==="invalid_credentials";
    return alert(wrongDetails?"ההתחברות נכשלה. בדוק משתמש וסיסמה.":"אין תשובה משרת הנתונים. בדוק את החיבור לרשת ונסה שוב."+(lastFetchProblem?"\n("+lastFetchProblem+")":""));
  }
  const ok=await loadCurrentUser(data.user);
  if(!ok)return;
  await loadAppData();
  initAppHistory();
  dashboard();
  if(currentUser.must_change_password) setTimeout(()=>changePasswordModal(true),80);
}

async function loadCurrentUser(authUser){
  if(!authUser){currentUser=null;return false;}
  const {data,error}=await supabaseClient
    .from("profiles")
    .select("username,first_name,last_name,display_name,role,is_active,must_change_password,all_businesses_access")
    .eq("id",authUser.id).single();
  if(error){
    console.error(error);
    // only sign out if the profile really doesn't exist; otherwise it's probably a connection problem
    if(error.code==="PGRST116"){await supabaseClient.auth.signOut();await login("לא ניתן לטעון את פרטי המשתמש.");}
    else showStartupError(serverProblemText());
    return false;
  }
  if(!data.is_active){await supabaseClient.auth.signOut();await login("המשתמש אינו פעיל. פנה למנהל המערכת.");return false;}
  currentUser={
    id:authUser.id,
    name:data.display_name,
    firstName:data.first_name || String(data.display_name||"").split(/\s+/)[0] || data.username,
    lastName:data.last_name || "",
    username:data.username,
    role:data.role,
    is_active:data.is_active,
    must_change_password:data.must_change_password,
    all_businesses_access:!!data.all_businesses_access
  };
  return true;
}

function confirmLogout(){
  showModal(`<h2>להתנתק מהמערכת?</h2><div class="actions"><button class="secondary" onclick="hideModal()">ביטול</button><button class="primary" onclick="doLogout(this)">התנתקות</button></div>`);
}
async function doLogout(btn){
  setBusy(btn,true,"מתנתק...");
  await supabaseClient.auth.signOut();
  currentUser=null;problems=[];problemActivity=[];businesses=[];userBusinesses=[];
  hideModal();await login();
}
async function logout(){confirmLogout();}

function changePasswordModal(forced=false){
  showModal(`<h2>${forced?"נדרשת החלפת סיסמה":"שינוי סיסמה"}</h2>
    ${forced?`<p class="u-sub">הסיסמה הנוכחית היא זמנית. יש לבחור סיסמה חדשה כדי להמשיך.</p>`:""}
    <label>סיסמה חדשה</label><input id="newPass1" type="password"><div class="password-hint">הסיסמה חייבת להכיל לפחות 6 תווים.</div>
    <label>אימות סיסמה</label><input id="newPass2" type="password">
    <div class="actions">
      ${forced?"":`<button class="secondary" onclick="hideModal()">ביטול</button>`}
      <button class="primary" onclick="changeOwnPassword(this,${forced})">שמירה</button>
    </div>`);
}
async function changeOwnPassword(btn,forced){
  const p1=document.getElementById("newPass1").value,p2=document.getElementById("newPass2").value;
  if(p1.length<6)return alert("הסיסמה חייבת להכיל לפחות 6 תווים");
  if(p1!==p2)return alert("הסיסמאות אינן זהות");
  setBusy(btn,true,"שומר...");
  const {data,error}=await supabaseClient.functions.invoke("admin-users",{body:{action:"change_own_password",password:p1}});
  if(error||data?.error){setBusy(btn,false);return alert("לא ניתן לשנות סיסמה: "+(data?.error||error?.message||"שגיאה"));}
  currentUser.must_change_password=false;hideModal();alert("הסיסמה עודכנה בהצלחה");
}

};

let exitConfirmOpen=false;
let pendingCalendarDay=null;

async function renderNamedScreen(name){
  const fn=screenRenderers[name]||screenRenderers.home;
  return await fn();
}
async function goToScreen(name,{push=true,direction="forward"}={}){
  if(!screenRenderers[name])name="home";
  if(currentScreen===name){await renderNamedScreen(name);return;}
  if(push)ensureExitGuard();
  previousScreen=currentScreen;currentScreen=name;
  await renderNamedScreen(name);
  if(push)history.pushState({izazoo:true,view:name},"",`#${name}`);
}
function navigateModule(name,push=true){return goToScreen(name,{push,direction:"forward"});}
function appBack(){history.back();}
function initAppHistory(){currentScreen="home";appHistoryReady=true;}
// History layout while the app is in use:  [guard 0] [guard 1] [home] [module...]
// Back on home lands on guard 1, which shows the exit dialog. Back again lands on
// guard 0, which cancels the dialog and returns to home. Entries are never added in
// response to a back press (Chrome's back button skips those); we move with
// history.go() between the existing ones instead.
const guardState=level=>({izazoo:true,exitGuard:true,level});
function pushScreenState(name){history.pushState({izazoo:true,view:name},"",`#${name}`);}
function ensureExitGuard(){
  const st=history.state;
  if(!st||!st.izazoo){
    history.replaceState(guardState(0),"","#izazoo-exit");
    history.pushState(guardState(1),"","#izazoo-confirm");
    pushScreenState(currentScreen);
  }else if(st.exitGuard&&!exitConfirmOpen&&currentUser){
    // sitting on a guard itself: step off it
    if(st.level===0)history.pushState(guardState(1),"","#izazoo-confirm");
    pushScreenState(currentScreen);
  }
}
// runs on every tap / key press, before the tapped button's own action
document.addEventListener("click",ensureExitGuard,true);
document.addEventListener("keydown",ensureExitGuard,true);
let exitReady=false; // "exit" was tapped but the browser can't close the app: next back press exits
function showExitConfirmation(){
  if(exitConfirmOpen)return;
  exitConfirmOpen=true;exitReady=true;
  showModal(`<div class="confirm-card"><h2>לצאת מ־IzaZoo?</h2><p class="u-sub" id="exitHint">לחץ שוב על כפתור החזרה של המכשיר כדי לצאת.</p><div class="actions"><button class="secondary" onclick="cancelAppExit()">ביטול</button></div></div>`,{exitModal:true});
  // a web app can't close itself, so move to the app's first history entry:
  // from there, one more press on the device's back button leaves the app
  if(history.state?.exitGuard&&history.state.level===1)history.back();
}
function cancelAppExit(){
  const level=history.state?.exitGuard?history.state.level:null;
  exitConfirmOpen=false;exitReady=false;document.getElementById("modal")?.remove();
  currentScreen="home";
  // return to the home entry that is still ahead of us in history
  if(level===0)history.go(2);else if(level!==null)history.go(1);
  // safety net: if that entry wasn't there, create it
  setTimeout(()=>{if(history.state?.exitGuard&&!exitConfirmOpen)ensureExitGuard();},400);
}
function showExitReadyHint(){} // the dialog already explains how to exit
function closeModalSmart(){
  if(calendarReturnDate){
    // opened from the calendar: step back to home in history too, then reopen that day
    const ds=calendarReturnDate;calendarReturnDate=null;hideModal();
    if(history.state?.view&&history.state.view!=="home"){pendingCalendarDay=ds;history.back();}
    else goToScreen("home",{push:false,direction:"back"}).then(()=>calendarDay(ds));
    return;
  }
  hideModal();
}
window.addEventListener("popstate",async e=>{
  const st=e.state;
  const modal=document.getElementById("modal");
  if(exitConfirmOpen){
    if(st?.exitGuard){
      if(st.level===0){
        if(exitReady)showExitReadyHint(); // we moved here ourselves after "exit" was tapped
        else cancelAppExit();             // back pressed while the dialog is open: cancel
      }
      return;
    }
    if(!st)return;
    exitConfirmOpen=false;exitReady=false;modal?.remove(); // moved forward into the app
  }else if(modal){
    // back closes the open window (a forced password change stays open),
    // then we return to the entry we came from without adding a new one
    if(!currentUser?.must_change_password){modal.remove();calendarReturnDate=null;}
    history.forward();
    return;
  }
  if(!currentUser)return; // login screen: nothing to protect
  if(!st||st.exitGuard){
    if(!st)history.replaceState(guardState(0),"","#izazoo-exit");
    if(currentScreen!=="home"){
      // back from an inner screen should go home, not offer to exit
      currentScreen="home";dashboard();ensureExitGuard();
      return;
    }
    showExitConfirmation();
    if(history.state?.level===0){exitReady=true;showExitReadyHint();} // already on the first entry
    return;
  }
  if(st.view&&st.view!==currentScreen)await goToScreen(st.view,{push:false,direction:"back"});
  if(pendingCalendarDay){const ds=pendingCalendarDay;pendingCalendarDay=null;if(currentScreen==="home")calendarDay(ds);}
});

function clearSearch(context,button){const box=button?.closest(".stable-search")||document.querySelector(`.stable-search[data-search-box="${context}"]`),input=box?.querySelector("input");removeSearchResultsForBox(box);if(input){input.value="";input.focus();}}
function searchMatches(context,q){
  const matches=[];
  const push=(type,id,label,primary,secondary="")=>{
    const hay=(String(primary||"")+" "+String(secondary||"")).toLowerCase();
    if(hay.includes(q))matches.push({type,id,label,text:String(primary||"")});

async function refreshOnResume(){
  __dlog(`refreshOnResume called, currentUser=${!!currentUser}, online=${navigator.onLine}, msSinceNetwork=${Date.now()-lastNetworkActivity}`);
  if(!currentUser||!navigator.onLine)return;
  if(Date.now()-lastNetworkActivity<1500){__dlog(`refreshOnResume SKIPPED (recent activity)`);return;}
  __dlog(`refreshOnResume PROCEEDING - will reload+render`);
  await loadAppData();
  // keep the screen as-is if the user is in the middle of typing something
  const typing=[...root().querySelectorAll("textarea,input:not([type=checkbox]):not([type=radio])")].some(el=>el.value.trim());
  if(typing)return;
  if(currentScreen==="home")dashboard();
  else if(screenRenderers[currentScreen])screenRenderers[currentScreen]();
  __dlog(`refreshOnResume finished rendering ${currentScreen}`);
}

function calendarHTML(mobile){
  const y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),title=first.toLocaleDateString("he-IL",{month:"long",year:"numeric"}),items=calendarItems();let cells="",offset=first.getDay();

  for(let d=1;d<=last.getDate();d++){const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,its=items.filter(x=>x.date===ds),types=[...new Set(its.map(x=>x.type))],markers=types.map(t=>`<i class="calendar-marker ${t}"></i>`).join("");cells+=`<div class="day ${ds===isoToday()?"today":""} ${its.length?"has-items":""}" onclick="calendarDay('${ds}')"><div class="day-num">${d}</div><div class="calendar-markers">${markers}</div><div class="events">${its.slice(0,3).map(x=>`<div class="event-pill ${typeClass(x.type)}">${typeIcon(x.type)} ${esc(x.title)}</div>`).join("")}</div></div>`;}

}

// ---- Knowledge (ידע ונהלים): a library of documents (PDF for now) ----
// Everyone sees the documents meant for their business; the owner and full
// administrators upload, edit, replace and archive them. Files live in the
// private "knowledge" storage bucket; the database decides who may read them.
const DOC_BUCKET="knowledge";
const DOC_MAX_BYTES=20*1024*1024; // 20 MB per file (owner's decision)
let docsCategoryFilter="all";      // "all", a category id, or "none"
let docViewerToken=0;              // stops drawing pages once the viewer is closed
const docFileCache=new Map();      // file path -> downloaded file (this visit only)

function formatFileSize(n){
  if(!n&&n!==0)return "";
  // wrapped in left-to-right marks so "180 KB" isn't flipped inside Hebrew text
  if(n<1024*1024)return "\u2066"+Math.max(1,Math.round(n/1024))+" KB\u2069";
  return "\u2066"+(n/1024/1024).toFixed(1)+" MB\u2069";
}
const docCategoryKey=k=>k.category_id==null?"none":String(k.category_id);
function knowledgeMeta(k){
  return [k.file_size?formatFileSize(k.file_size):"","עודכן "+formatProblemDateTime(k.updated_at)].filter(Boolean).join(" · ");
}
function knowledgeCardHTML(k){
  const audience=currentBusinessId==="all"?`<div class="bus-label">${esc(audienceLabel(k.all_businesses,knowledgeTargetIds(k.id)))}</div>`:"";
  return `<div class="list-card knowledge-card" onclick="openKnowledge(${Number(k.id)})">
    <div class="doc-row"><span class="doc-icon" aria-hidden="true">📄</span><div class="doc-main">
      <div class="knowledge-title">${k.is_pinned?"📌 ":""}${esc(k.title)}</div>
      <div class="knowledge-category">${esc(categoryName(k.category_id))}</div>
      <div class="item-meta">${esc(knowledgeMeta(k))}</div>${audience}
    </div></div>
  </div>`;
}
// business filter: the app-wide active business (only when there is a choice)
function docsBusinessChipsHTML(){
  const bs=availableBusinesses();
  const chips=(canAdmin()?[{v:"all",label:"כל העסקים"}]:[]).concat(bs.map(b=>({v:String(b.id),label:b.name})));
  if(chips.length<2)return "";
  return `<div class="doc-chips" role="group" aria-label="עסק">${chips.map(c=>`<button type="button" class="doc-chip ${String(currentBusinessId)===c.v?"active":""}" onclick="switchBusiness('${c.v}')">${esc(c.label)}</button>`).join("")}</div>`;
}
// category filter: only categories that have documents for the selected business
function docsCategoryChipsHTML(items){
  const present=new Set(items.map(docCategoryKey));
  if(present.size<2)return "";
  const cats=knowledgeCategories.filter(c=>present.has(String(c.id))).map(c=>({v:String(c.id),label:c.name}));
  if(present.has("none"))cats.push({v:"none",label:"ללא קטגוריה"});
  const chips=[{v:"all",label:"הכל"}].concat(cats);
  return `<div class="doc-chips" role="group" aria-label="קטגוריה">${chips.map(c=>`<button type="button" class="doc-chip ${docsCategoryFilter===c.v?"active":""}" onclick="setDocsCategory('${c.v}')">${esc(c.label)}</button>`).join("")}</div>`;
}
function setDocsCategory(v){docsCategoryFilter=v;docsScreen();}
function docsScreen(){
  currentScreen="docs";
  const all=visibleKnowledge(false);
  if(docsCategoryFilter!=="all"&&!all.some(k=>docCategoryKey(k)===docsCategoryFilter))docsCategoryFilter="all";
  const shown=docsCategoryFilter==="all"?all:all.filter(k=>docCategoryKey(k)===docsCategoryFilter);
  const empty=canAdmin()?"אין עדיין מסמכים. אפשר להעלות בכפתור ״מסמך חדש״.":"אין עדיין מסמכים.";
  const rows=shown.length?shown.map(knowledgeCardHTML).join(""):`<div class="u-sub">${empty}</div>`;
  // archived documents: only administrators see them (to bring them back)
  const archived=canAdmin()?visibleKnowledge(true):[];
  const archive=archived.length?`<h3 style="margin:20px 0 10px">ארכיון</h3>${archived.map(knowledgeCardHTML).join("")}`:"";
  const titleHTML=categoryHeaderTitle("ידע ונהלים",all.length,canAdmin()?"newKnowledge()":null,"מסמך חדש");
  page(titleHTML,"","docs",`<div class="page knowledge-page">${docsBusinessChipsHTML()}${docsCategoryChipsHTML(all)}${rows}${archive}</div>`);

// ---- uploading ----
function docCategoryOptions(selected){
  return `<option value="">ללא קטגוריה</option>${knowledgeCategories.filter(c=>c.is_active||Number(c.id)===Number(selected)).map(c=>`<option value="${c.id}" ${Number(c.id)===Number(selected)?"selected":""}>${esc(c.name)}</option>`).join("")}`;

function docFileChosen(input,titleId){
  const f=input.files?.[0],t=document.getElementById(titleId);
  if(f&&t&&!t.value.trim())t.value=f.name.replace(/\.[^.]+$/,"");

function checkDocFile(f){
  if(!f)return "יש לבחור קובץ";
  if(!(f.type==="application/pdf"||/\.pdf$/i.test(f.name)))return "אפשר להעלות רק קובצי PDF";
  if(f.size>DOC_MAX_BYTES)return "הקובץ גדול מדי (עד 20MB)";
  return "";
}
async function uploadDocFile(f){
  const id=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);
  const path=`${id}.pdf`;
  const {error}=await supabaseClient.storage.from(DOC_BUCKET).upload(path,f,{contentType:"application/pdf",upsert:false});
  return {path,error};
}

  const {data,error}=await supabaseClient.from("knowledge_items").insert({

    file_path:up.path,file_name:f.name,file_type:"application/pdf",file_size:f.size
  }).select("id").single();
  if(error){
    await supabaseClient.storage.from(DOC_BUCKET).remove([up.path]); // don't leave an orphan file
    setBusy(btn,false);console.error("knowledge_items insert",error);return toast("לא ניתן לשמור את המסמך: "+error.message,"error");
  }
  if(!aud.all){
    const {error:e}=await supabaseClient.from("knowledge_businesses").insert(aud.ids.map(business_id=>({knowledge_id:data.id,business_id})));
    if(e){console.error("knowledge_businesses insert",e);toast("המסמך נשמר אך שיוך העסקים נכשל","error");}
  }
  await loadKnowledge();hideModal();toast("המסמך הועלה");docsScreen();

// ---- viewing ----
let pdfjsLib=null;
async function loadPdfJs(){
  if(!pdfjsLib){
    pdfjsLib=await import("./vendor/pdfjs/pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc="./vendor/pdfjs/pdf.worker.min.mjs";
  }
  return pdfjsLib;
}
async function fetchDocFile(k){
  if(docFileCache.has(k.file_path))return docFileCache.get(k.file_path);
  const {data,error}=await supabaseClient.storage.from(DOC_BUCKET).download(k.file_path);
  if(error)throw error;
  docFileCache.set(k.file_path,data);return data;
}
function openKnowledge(id){
  const k=docs.find(x=>Number(x.id)===Number(id));if(!k)return;
  const admin=canAdmin()?`<button type="button" class="secondary" onclick="editKnowledge(${Number(id)})">פרטים</button><button type="button" class="secondary" onclick="${k.is_archived?`archiveKnowledge(${Number(id)},true,this)`:`confirmArchiveKnowledge(${Number(id)})`}">${k.is_archived?"החזר לפעילים":"ארכוב"}</button>`:"";
  const download=k.file_path?`<button type="button" class="secondary" onclick="downloadKnowledge(${Number(id)},this)">הורדה</button>`:"";
  showModal(`<div class="doc-viewer-head">
      <div class="doc-viewer-title"><h2>${k.is_pinned?"📌 ":""}${esc(k.title)}</h2><div class="item-meta">${esc(categoryName(k.category_id))} · ${esc(knowledgeMeta(k))}</div></div>
      <button type="button" class="secondary" onclick="hideModal()">חזרה</button>
    </div>
    <div class="doc-viewer-actions">${download}${admin}</div>
    <div class="doc-pages" id="docPages"><div class="u-sub doc-loading">טוען מסמך...</div></div>`,{cardClass:"doc-viewer"});
  renderKnowledgeFile(k);
}
async function renderKnowledgeFile(k){
  const token=++docViewerToken;
  const box=()=>token===docViewerToken?document.getElementById("docPages"):null;
  if(!k.file_path){const b=box();if(b)b.innerHTML=`<div class="knowledge-full-body">${esc(k.body||"")}</div>`;return;}
  let task=null;
  try{
    const [lib,file]=await Promise.all([loadPdfJs(),fetchDocFile(k)]);
    task=lib.getDocument({data:new Uint8Array(await file.arrayBuffer())});
    const pdf=await task.promise;
    const b=box();if(!b)return;
    b.innerHTML="";
    const width=Math.max(200,b.clientWidth-16);
    const dpr=Math.min(window.devicePixelRatio||1,2);
    for(let n=1;n<=pdf.numPages;n++){
      if(!box())return; // the viewer was closed
      const pageObj=await pdf.getPage(n);
      const scale=width/pageObj.getViewport({scale:1}).width;
      const vp=pageObj.getViewport({scale:scale*dpr});
      const canvas=document.createElement("canvas");
      canvas.className="doc-page";canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);
      canvas.style.width=width+"px";canvas.setAttribute("aria-label",`עמוד ${n} מתוך ${pdf.numPages}`);
      box()?.appendChild(canvas);
      await pageObj.render({canvas,canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
    }
  }catch(e){
    console.error("document",e);
    const b=box();if(b)b.innerHTML=`<div class="u-sub doc-loading">לא ניתן להציג את המסמך. ${navigator.onLine?"נסה שוב מאוחר יותר.":"בדוק את החיבור לרשת."}</div>`;
  }finally{task?.destroy();} // free the viewer's memory
}
async function downloadKnowledge(id,btn){
  const k=docs.find(x=>Number(x.id)===Number(id));if(!k?.file_path)return;
  setBusy(btn,true,"מוריד...");
  try{
    const url=URL.createObjectURL(await fetchDocFile(k));
    const a=document.createElement("a");a.href=url;a.download=k.file_name||(k.title+".pdf");
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(e){console.error("download",e);toast("ההורדה נכשלה","error");}
  setBusy(btn,false);
}

async function saveKnowledge(id,btn){
  const k=docs.find(x=>Number(x.id)===Number(id));if(!k)return;
  const oldPath=k.file_path; // remember it before saving, to remove the old file afterwards
  const modal=btn.closest(".modal-card"),title=modal.querySelector("#ekTitle").value.trim(),aud=selectedAudience("ek",modal);
  const f=modal.querySelector("#ekFile").files?.[0];
  if(!title)return toast("יש להזין כותרת","error");
  if(!aud.all&&!aud.ids.length)return toast("יש לבחור לפחות עסק אחד","error");
  if(f){const bad=checkDocFile(f);if(bad)return toast(bad,"error");}
  if(!checkOnline())return;setBusy(btn,true,f?"מעלה...":"שומר...");
  let up=null;
  if(f){up=await uploadDocFile(f);if(up.error){setBusy(btn,false);console.error("knowledge upload",up.error);return toast("העלאת הקובץ נכשלה: "+up.error.message,"error");}}
  // the previous version is kept in the database (not shown in the app)
  await supabaseClient.from("knowledge_versions").insert({knowledge_id:id,title:k.title,body:k.body||null,file_name:k.file_name||null,edited_by:currentUser.id});
  const changes={title,category_id:Number(modal.querySelector("#ekCategory").value)||null,is_pinned:modal.querySelector("#ekPinned").checked,updated_by:currentUser.id,updated_at:new Date().toISOString()};
  if(up)Object.assign(changes,{file_path:up.path,file_name:f.name,file_type:"application/pdf",file_size:f.size});
  const {error}=await supabaseClient.from("knowledge_items").update(changes).eq("id",id);
  if(error){
    if(up)await supabaseClient.storage.from(DOC_BUCKET).remove([up.path]);
    setBusy(btn,false);console.error("knowledge_items update",error);return toast("לא ניתן לשמור: "+error.message,"error");
  }
  if(up&&oldPath){await supabaseClient.storage.from(DOC_BUCKET).remove([oldPath]);docFileCache.delete(oldPath);} // the old file is no longer needed
  const {error:rerr}=await supabaseClient.rpc("replace_knowledge_targets",{target_knowledge_id:id,business_ids:aud.ids,new_all_businesses:aud.all});
  if(rerr){console.error("replace_knowledge_targets",rerr);toast("המסמך נשמר אך שיוך העסקים לא עודכן","error");}
  await loadKnowledge();refreshScreenBehindModal("docs",docsScreen);
  if(!rerr)toast("המסמך עודכן");
  openKnowledge(id);
}

  const k=docs.find(x=>Number(x.id)===Number(id));if(!k)return;
  showModal(`<h2>להעביר לארכיון?</h2><p>"${esc(k.title)}" לא יוצג יותר למשתמשים. אפשר להחזיר אותו מהארכיון בכל עת.</p><div class="actions"><button class="secondary" onclick="openKnowledge(${Number(id)})">ביטול</button><button class="primary" onclick="archiveKnowledge(${Number(id)},false,this)">ארכוב</button></div>`);

  if(a.action==="password_reset")return `${actor} איפס/ה סיסמה ל${target}`;
  if(a.action==="user_profile_updated")return `${actor} עדכן/ה את פרטי ${target}`;
  return `${actor} ביצע/ה פעולת ניהול`;
}

function adminUserAccessMode(prefix){

  const wrap=document.getElementById(prefix+"BusinessWrap");
  if(wrap)wrap.style.opacity=global?.checked?".45":"1";
  wrap?.querySelectorAll("input").forEach(x=>x.disabled=!!global?.checked);
}

async function saveAdminUser(uid,btn){
  const p=profilesById[uid],first=euFirst.value.trim(),last=euLast.value.trim(),role=euRole.value,active=euActive.value==="true";
  if(!first||!last)return alert("יש להזין שם פרטי ושם משפחה");
  const global=role==="owner"||euGlobal.checked;
  const desired=global?[]:[...document.querySelectorAll(".euBusiness:checked")].map(x=>Number(x.value));
  const current=new Set(membershipsForUser(uid));
  if(!checkOnline())return;setBusy(btn,true,"שומר...");
  const {data,error}=await supabaseClient.functions.invoke("admin-users",{body:{action:"update_user",user_id:uid,display_name:`${first} ${last}`,username:euUsername.value.trim().toLowerCase()}});
  if(error||data?.error){setBusy(btn,false);return toast("עדכון המשתמש נכשל","error");}
  const calls=[supabaseClient.rpc("admin_set_profile_identity",{target_user:uid,new_first_name:first,new_last_name:last})];
  if(role!==p.role)calls.push(supabaseClient.rpc("admin_set_user_role",{target_user:uid,new_role:role}));
  if(active!==(p.is_active!==false))calls.push(supabaseClient.rpc("admin_set_user_active",{target_user:uid,new_active:active}));
  calls.push(supabaseClient.rpc("admin_set_all_businesses_access",{target_user:uid,new_value:global}));
  if(!global){
    for(const bid of desired)if(!current.has(bid))calls.push(supabaseClient.rpc("admin_add_user_to_business",{target_user:uid,target_business:bid}));
    for(const bid of current)if(!desired.includes(bid))calls.push(supabaseClient.rpc("admin_remove_user_from_business",{target_user:uid,target_business:bid}));
  }
  const results=await Promise.all(calls);
  const failed=results.find(x=>x.error);
  if(failed){setBusy(btn,false);return toast("חלק מההרשאות לא עודכנו","error");}
  await loadProfiles();await loadAdminData();hideModal();toast("המשתמש עודכן");adminScreen();
}

function setBusy(btn,busy,label=""){
  if(!btn)return;
  if(busy){
    if(!btn.dataset.originalText)btn.dataset.originalText=btn.textContent;
    btn.disabled=true;if(label)btn.textContent=label;
  }else{
    btn.disabled=false;if(btn.dataset.originalText){btn.textContent=btn.dataset.originalText;delete btn.dataset.originalText;}
  }
}

function viewportMode(){return window.matchMedia("(orientation: portrait)").matches?"portrait":"landscape";}
function applyViewportMode(){
  const mode=viewportMode();
  const changed=lastViewportMode!==null && lastViewportMode!==mode;
  lastViewportMode=mode;
  document.body.classList.toggle("is-portrait",mode==="portrait");
  document.body.classList.toggle("is-landscape",mode==="landscape");
  return changed;
}
// screens are built for one orientation only, so redraw the current screen when it changes
function onViewportChange(){
  const changed=applyViewportMode();
  if(changed&&currentUser&&screenRenderers[currentScreen])screenRenderers[currentScreen]();
}

let startupFailed=false;
async function bootstrap(){
  // renewing a saved login needs the server; don't wait on it for more than 10 seconds
  const res=await Promise.race([supabaseClient.auth.getSession(),new Promise(r=>setTimeout(()=>r({timedOut:true}),10000))]);
  if(res.timedOut){startupFailed=true;showStartupError(serverProblemText());return;}
  if(startupFailed)return;
  const session=res.data?.session;
  if(session?.user){
    const ok=await loadCurrentUser(session.user);
    if(!ok)return;
    await loadAppData();
    initAppHistory();
    const savedScreen=sessionStorage.getItem("__izazoo_returnScreen");
    __dlog(`bootstrap: savedScreen from sessionStorage = ${savedScreen}, screenRenderers has it = ${savedScreen?!!screenRenderers[savedScreen]:"n/a"}`);
    if(savedScreen&&screenRenderers[savedScreen]){
      sessionStorage.removeItem("__izazoo_returnScreen");
      dashboard();
      setTimeout(()=>{__dlog(`bootstrap: delayed navigation to ${savedScreen}`);goToScreen(savedScreen,{push:false});},120);
    }else{
      dashboard();
      const view=history.state?.view;
      if(view&&view!=="home"&&screenRenderers[view])await goToScreen(view,{push:false});
    }
    if(currentUser.must_change_password)setTimeout(()=>changePasswordModal(true),80);
  }else{
    await login();
  }
}
function forceRefresh(){
  __dlog(`forceRefresh() called, currentScreen=${currentScreen}, saving to sessionStorage`);
  sessionStorage.setItem("__izazoo_returnScreen",currentScreen);
  __dlog(`forceRefresh() saved value=${sessionStorage.getItem("__izazoo_returnScreen")}, calling location.reload()`);
  location.reload();
}
bootstrap().catch(e=>{console.error("bootstrap",e);showStartupError("אירעה שגיאה בטעינת IzaZoo: "+esc(e?.message||e));});
// never leave the user on the loading screen forever
setTimeout(()=>{if(!currentUser&&!document.querySelector("#root .login-card")){startupFailed=true;showStartupError(serverProblemText());}},45000);
</script>
